nameOverride: ""
fullnameOverride: ""

registry:
  server: ghcr.io
  username: ""
  password: ""
  # 既存の kubernetes.io/dockerconfigjson Secret 名。設定時はチャートで Secret を作成しない。
  existingSecret: ""

imagePullSecrets:
  - name: ghcr-secret

frontend:
  image:
    # 未指定の場合 <registry.server>/<registry.username>/gomi-no-hi-frontend を使用
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources: {}

backend:
  image:
    # 未指定の場合 <registry.server>/<registry.username>/gomi-no-hi-backend を使用
    repository: ""
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  env:
    GIN_MODE: release
  vapid:
    publicKey: ""
    privateKey: ""
    subject: ""
  # 既存の Opaque Secret 名。設定時はチャートで Secret を作成しない。
  # Secret には VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT が必要。
  existingSecret: ""
  resources: {}

redis:
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  host: redis
  port: 6379
  auth:
    password: ""
    # 既存の Opaque Secret 名。設定時はチャートで Secret を作成しない。
    # Secret には REDIS_PASSWORD が必要。
    existingSecret: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources: {}
